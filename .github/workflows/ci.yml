name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gettext libglib2.0-dev-bin \
            libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Translations are valid
        run: for po in po/*.po; do msgfmt --check -o /dev/null "$po"; done

  supply-chain:
    name: cargo deny · cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  secrets:
    name: secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-bench:
    name: release build · memory benchmark
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gettext libglib2.0-dev-bin \
            libgtk-4-dev libadwaita-1-dev weston
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package strata
      # Headless runners have no GPU: the software (cairo) renderer gives
      # stable, comparable figures (see docs/perf/J0.md).
      - name: Memory benchmark (idle)
        # Non-blocking until a baseline measured on the CI runner is recorded
        # in bench/baseline.json (local figures differ: other GTK version).
        continue-on-error: true
        run: cargo xtask bench-mem --display headless --renderer cairo --runs 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-mem
          path: target/bench-mem/*.json
